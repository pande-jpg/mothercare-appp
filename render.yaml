databases:
  - name: mothercare-db
    plan: free
    databaseName: mothercare
    user: mothercare

services:
  - type: web
    name: mothercare
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn config.wsgi:application"

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mothercare-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"
